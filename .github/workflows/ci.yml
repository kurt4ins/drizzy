name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Build all services
        run: |
          go build ./bot-service/...
          go build ./profile-service/...
          go build ./ranking-service/...
          go build ./pkg/...

      - name: Run tests
        run: go test ./... -race -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          args: --timeout=5m

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build profile-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: profile-service/Dockerfile
          push: false
          tags: drizzy/profile-service:ci
      - name: Build ranking-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ranking-service/Dockerfile
          push: false
          tags: drizzy/ranking-service:ci
      - name: Build bot-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot-service/Dockerfile
          push: false
          tags: drizzy/bot-service:ci
